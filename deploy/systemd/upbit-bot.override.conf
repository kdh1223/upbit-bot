[Service]
EnvironmentFile=-/etc/default/telegram-bot
RuntimeDirectory=upbit-bot
RuntimeDirectoryMode=0755

ExecStartPost=/bin/bash -lc 'FLAG_FILE="/run/upbit-bot/%n.failed_flag"; LAST_FILE="/run/upbit-bot/%n.last_stop"; NOW_TS=$(date +%s); if [ -f "$FLAG_FILE" ]; then MSG="⚠️ 비정상 종료 후 자동 복구됨"; rm -f "$FLAG_FILE"; elif [ -f "$LAST_FILE" ]; then LAST_TS=$(cat "$LAST_FILE" 2>/dev/null || echo 0); if [ $((NOW_TS - LAST_TS)) -le 30 ]; then MSG="🔁 봇 재시작됨"; else MSG="🟢 봇 시작됨"; fi; else MSG="🟢 봇 시작됨"; fi; if [ -n "${TELEGRAM_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then curl -sS --max-time 5 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" -d "disable_web_page_preview=true" >/dev/null || true; fi'
ExecStopPost=/bin/bash -lc 'date +%s > /run/upbit-bot/%n.last_stop || true'

OnFailure=telegram-fail-notify@%n.service
